<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jalan - crowd-reported navigation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#10202b;--panel:#fff8e7;--ink:#10202b;--accent:#ff5a36;--ok:#1b8a5a;--line:#d9cfb4}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:"Trebuchet MS",Verdana,sans-serif;color:var(--ink)}
#map{position:absolute;inset:0}
.top{position:absolute;z-index:1000;top:10px;left:10px;right:10px;max-width:460px;background:var(--panel);border-radius:14px;padding:10px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.top input{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
.top input+input{margin-top:8px}
#bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#barTxt{flex:1;font-weight:700;font-size:15px;line-height:1.3}
#tog{padding:6px 12px}
.mb{position:absolute;z-index:1003;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.mb button{background:var(--panel);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.35);width:52px;height:52px;border-radius:50%;padding:0;font-size:22px}
.top.min #body{display:none}
.top.min #bar{margin-bottom:0}
.opts{display:flex;gap:14px;margin-top:8px;font-size:14px;align-items:center;flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:6px}
.opts input{width:auto;padding:0;border:0;margin:0}
.opts input[type=time]{padding:5px;border:2px solid var(--line);border-radius:8px}
#lanes{display:none;gap:4px;margin:0 0 8px;justify-content:center}
#lanes span{min-width:34px;text-align:center;padding:4px;border-radius:6px;background:#e8e0c8;color:#9a9078;font-size:20px;font-weight:700}
#lanes span.v{background:var(--bg);color:#fff}
#navtop{display:none;position:absolute;z-index:1002;top:10px;left:10px;right:10px;background:#005f63;color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#nt-main{display:flex;align-items:center;gap:16px}
#nt-arrow{font-size:54px;line-height:1;min-width:60px;text-align:center}
#nt-dist{font-size:34px;font-weight:700;line-height:1.1}
#nt-text{font-size:19px;line-height:1.25}
#nt-then{margin-top:10px;font-size:16px;border-top:1px solid rgba(255,255,255,.3);padding-top:8px}
#nt-then-arrow{font-size:22px;margin-left:6px}
#navtop #lanes{margin:10px 0 0}
#navtop #lanes span{background:rgba(255,255,255,.2);color:#d6ecec}
#navtop #lanes span.v{background:#fff;color:#005f63}
#navbot{display:none;position:absolute;z-index:1002;left:0;right:0;bottom:0;background:#fff;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:space-between;box-shadow:0 -4px 16px rgba(0,0,0,.25);border-radius:22px 22px 0 0}
#navbot button{width:52px;height:52px;border-radius:50%;padding:0;font-size:22px;background:#fff;color:var(--ink);border:2px solid var(--line)}
#nb-mid{text-align:center;cursor:pointer;flex:1}
#navbot::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:5px;border-radius:3px;background:#ccc;transform:translateX(-50%)}
#nb-eta{font-size:32px;font-weight:700;color:#1b8a5a;line-height:1.1}
#nb-sub{font-size:16px;color:#555}
#startbtn{display:none;position:absolute;z-index:1000;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#1b8a5a;color:#fff;font-size:20px;padding:14px 40px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
body.nav #navtop{display:block}
body.nav #navbot{display:flex}
body.nav .top{display:none}
body.nav .report{display:none}
body.nav.rep .report{display:flex;bottom:calc(210px + env(safe-area-inset-bottom,0px))}
body.nav #hud{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
body.nav #toast{bottom:130px}
body.nav #startbtn{display:none!important}
#sheet{display:none;position:absolute;z-index:1001;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));max-height:58vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:14px 14px 18px;box-shadow:0 -4px 16px rgba(0,0,0,.3)}
#sheet.open{display:block}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips button{background:#f4ecd4;color:var(--ink);padding:8px 2px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
.chips button span{font-size:22px}
#sq{margin-top:10px;width:100%;padding:11px;border:2px solid var(--line);border-radius:10px;font-size:16px}
.pc{border:2px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;font-size:14px}
.pc b{display:block}.pc small{color:#555}
.pb{display:flex;gap:8px;margin-top:8px}.pb button{flex:1;padding:8px}.pb button.alt{background:var(--accent)}
.sec{font-weight:700;margin-top:12px}
.sheetbtns{display:flex;gap:8px;margin-top:12px}
.sheetbtns button{flex:1;background:#fff;color:var(--ink);border:2px solid var(--line)}
.mb{align-items:flex-end}
.mb #follow{width:auto;border-radius:26px;padding:0 16px;font-size:14px;font-weight:700}
.mb #follow.on{background:var(--accent);color:#fff}
#attr{position:absolute;z-index:999;left:6px;bottom:calc(2px + env(safe-area-inset-bottom,0px));font-size:10px;background:rgba(255,255,255,.8);padding:1px 5px;border-radius:4px}
body.nav #attr{left:auto;right:6px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.hu #map{inset:auto;left:50%;top:50%;width:125vmax;height:125vmax;margin:-62.5vmax 0 0 -62.5vmax;transition:transform .5s linear}
body.hu .leaflet-control-container{display:none}
body.hu .pin{transform:rotate(var(--hdg,0deg))}
#hud{position:absolute;z-index:1000;left:10px;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:none;gap:8px;align-items:center}
.spd{background:#fff;color:#111;border-radius:50%;width:66px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.spd b{font-size:26px;display:block}.spd small{font-size:11px}.spd.over{background:#c62828;color:#fff}
.lim{width:46px;height:46px;border-radius:50%;border:5px solid #d32f2f;background:#fff;color:#111;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.top input:focus{outline:3px solid var(--accent);border-color:var(--accent)}
.row{display:flex;gap:8px;margin-top:8px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg);color:#fff}
button.go{background:var(--accent);flex:1}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#res{margin:6px 0 0;padding:0;list-style:none;max-height:240px;overflow:auto}
#res li{padding:10px;border:2px solid var(--line);background:#fff;border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:14px;line-height:1.35}
#res li:hover,#res li:active{background:#f1e6c6;border-color:var(--accent)}
#info{margin-top:8px;font-size:14px;line-height:1.4}
#steps{max-height:150px;overflow:auto;margin:6px 0 0;padding-left:18px;font-size:13px}
.report{position:absolute;z-index:1000;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:10px;right:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.report button{background:var(--panel);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.35)}
.report button.on{background:var(--accent);color:#fff}
.pin{font-size:24px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
#toast{position:absolute;z-index:1001;left:50%;bottom:80px;transform:translateX(-50%);background:var(--bg);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;display:none}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div id="bar"><span id="barTxt">Search a destination</span><button id="tog" aria-label="Show or hide the search panel">Hide</button></div>
  <div id="lanes"></div>
  <div id="body">
  <input id="from" placeholder="From (type a start, or tap the map)" aria-label="Start" autocomplete="off">
  <input id="q" placeholder="Where to? (e.g. KLCC, Penang airport)" aria-label="Destination" autocomplete="off">
  <ul id="res"></ul>
  <div class="row"><button class="go" id="go">Get route</button><button id="loc">My location</button><button id="mute" aria-label="Turn voice on or off">&#128266;</button></div>
  <div class="opts"><label><input type="checkbox" id="notoll"> Avoid tolls</label><label><input type="checkbox" id="nohwy"> Avoid highways</label></div>
  <div class="opts"><label>Arrive by <input type="time" id="arr"></label></div>
  <div id="info">Search a destination, or tap the map to set one.</div>
  <ol id="steps"></ol>
  </div>
</div>
<div class="report" id="rep">
  <button data-t="police">&#128110; Police</button>
  <button data-t="crash">&#128165; Crash</button>
  <button data-t="hazard">&#9888;&#65039; Hazard</button>
  <button data-t="jam">&#128678; Jam</button>
</div>
<div id="sheet">
  <div class="chips" id="chips"></div>
  <input id="sq" placeholder="Find a place or address" aria-label="Find a place or address" autocomplete="off">
  <div id="plist"></div>
  <div id="stoplist"></div>
  <div class="sheetbtns"><button id="newdrive">New drive</button><button id="clearstops">Clear stops</button></div>
</div>
<button id="startbtn">Start</button>
<div id="navtop">
  <div id="nt-main"><span id="nt-arrow">&#8593;</span><div><div id="nt-dist">--</div><div id="nt-text"></div></div></div>
  <div id="nt-then">Then <span id="nt-then-arrow"></span></div>
</div>
<div id="navbot">
  <button id="endnav" aria-label="End navigation">&#10005;</button>
  <div id="nb-mid"><div id="nb-eta">-- min</div><div id="nb-sub"></div></div>
  <button id="nb-rep" aria-label="Report on the road">&#9888;&#65039;</button>
</div>
<div id="attr">&copy; OpenStreetMap contributors</div>
<div id="hud"></div>
<div class="mb">
  <button id="follow" class="on" aria-label="Map orientation">&#10148; North Up</button><button id="recenter" aria-label="Centre on my location">&#9678;</button>
  <button id="whole" aria-label="Show whole route">&#128506;</button><button id="mute2" aria-label="Voice on or off">&#128266;</button><button id="more" aria-label="Quick search, stops and new drive">&#9776;</button>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const ICON={police:"\u{1F46E}",crash:"\u{1F4A5}",hazard:"\u26A0\uFE0F",jam:"\u{1F6A6}"};
const TTL=2*60*60*1000; // reports expire after 2 hours
const map=L.map("map",{zoomControl:false,attributionControl:false}).setView([3.139,101.687],12);
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);

let me=null,meMarker=null,dest=null,destMarker=null,routeLine=null,pendingType=null,lastRoute=null;
const markers={};
let watchId=null,nav=null,offCount=0,lastReroute=0,meFromGPS=false,muted=false,announceNext=false,follow=false,navMode=false,heading=0,stops=[],stopMarkers=[],hu=false,rot=0,lim=null,cams=[],lastRoad=0,speedKmh=null,camSaid={},hiddenAt=0;

// ---- reports (stored in this browser; swap for a backend to share between users)
function load(){try{return JSON.parse(localStorage.getItem("jalan.reports")||"[]").filter(r=>Date.now()-r.t<TTL)}catch(e){return[]}}
function save(a){try{localStorage.setItem("jalan.reports",JSON.stringify(a))}catch(e){}}
let reports=load();
function draw(){
  Object.values(markers).forEach(m=>map.removeLayer(m));
  reports.forEach(r=>{
    const m=L.marker([r.lat,r.lng],{icon:L.divIcon({className:"",html:`<div class="pin">${ICON[r.type]}</div>`,iconSize:[24,24],iconAnchor:[12,12]})}).addTo(map);
    m.bindPopup(`${r.type} reported ${Math.round((Date.now()-r.t)/60000)} min ago<br><button style="margin-top:6px;padding:4px 8px" onclick="gone('${r.id}')">It's gone</button>`);
    markers[r.id]=m;
  });
}
window.gone=id=>{reports=reports.filter(r=>r.id!==id);save(reports);draw();toast("Report removed")};
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2500)}

document.getElementById("rep").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const t=b.dataset.t;
  if(me){add(t,me.lat,me.lng);return}
  pendingType=t;document.querySelectorAll(".report button").forEach(x=>x.classList.toggle("on",x===b));
  toast("Tap the map where it is");
});
function add(type,lat,lng){
  reports.push({id:String(Date.now()),type,lat,lng,t:Date.now()});save(reports);draw();toast("Reported - thanks");
  if(dest&&lastRoute)reroute(true);
}

// ---- geocode + routing (Nominatim + OSRM public demo servers)
async function search(id){
  const q=document.getElementById(id).value.trim();if(!q)return;
  const ul=document.getElementById("res");ul.innerHTML="<li>Searching...</li>";
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=5&q="+encodeURIComponent(q));
    const d=await r.json();
    ul.innerHTML=d.length?"":"<li>No match. Try a more specific name.</li>";
    d.forEach(p=>{const li=document.createElement("li");li.textContent=p.display_name;li.onclick=()=>{ul.innerHTML="";document.getElementById(id).value=p.display_name.split(",").slice(0,2).join(",");id==="q"?setDest(+p.lat,+p.lon):setStart(+p.lat,+p.lon)};ul.appendChild(li)});
  }catch(e){ul.innerHTML="<li>Search failed. Check your internet connection.</li>"}
}
function setDest(lat,lng){
  dest={lat,lng};if(stops.length){stops=[];drawStops()}if(destMarker)map.removeLayer(destMarker);
  destMarker=L.marker([lat,lng],{icon:L.divIcon({className:"",html:'<div class="pin">\u{1F4CD}</div>',iconSize:[24,24],iconAnchor:[12,24]})}).addTo(map);map.setView([lat,lng],14);
  if(me)reroute();else document.getElementById("info").textContent="Destination set. Now type your start in the From box, or tap the map.";
}
function setMe(lat,lng,gps){
  meFromGPS=!!gps;me={lat,lng};if(meMarker)map.removeLayer(meMarker);
  meMarker=L.marker([lat,lng],{interactive:false,zIndexOffset:1000,icon:L.divIcon({className:"",iconSize:[44,44],iconAnchor:[22,22],html:'<svg width="44" height="44" viewBox="0 0 44 44" style="transform:rotate('+(hu?0:(heading||0))+'deg)"><circle cx="22" cy="22" r="19" fill="#fff" stroke="#cfd8e3" stroke-width="2"/><path d="M22 8L31 33L22 27L13 33Z" fill="#1a73e8"/></svg>'})}).addTo(map);
}
function setStart(lat,lng){setMe(lat,lng);map.setView([lat,lng],14);if(dest)reroute();else document.getElementById("info").textContent="Start set. Now search your destination."}
function locate(){
  if(!navigator.geolocation){toast("Location not available");return}
  navigator.geolocation.getCurrentPosition(p=>{setMe(p.coords.latitude,p.coords.longitude,true);map.setView([me.lat,me.lng],14);if(dest)reroute()},()=>toast("GPS unavailable here. Type your start in the From box."),{enableHighAccuracy:true});
}
// distance from point to segment in metres (flat approximation, fine for short ranges)
function dSeg(p,a,b){
  const k=111320,cx=Math.cos(p[0]*Math.PI/180);
  const px=p[1]*k*cx,py=p[0]*k,ax=a[1]*k*cx,ay=a[0]*k,bx=b[1]*k*cx,by=b[0]*k;
  const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;
  let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function hits(route){
  const c=route.geometry.coordinates.map(([x,y])=>[y,x]);
  return reports.filter(r=>{for(let i=0;i<c.length-1;i++){if(dSeg([r.lat,r.lng],c[i],c[i+1])<40)return true}return false});
}
async function reroute(fromReport){
  if(!me||!dest)return;
  const info=document.getElementById("info");info.textContent="Finding routes...";
  try{
    const u=`https://router.project-osrm.org/route/v1/driving/${[me,...stops,dest].map(p=>p.lng+","+p.lat).join(";")}?alternatives=${stops.length?"false":"true"}&overview=full&geometries=geojson&steps=true`;
    const ex=[document.getElementById("notoll").checked?"toll":"",document.getElementById("nohwy").checked?"motorway":""].filter(Boolean).join(",");
    let d=await(await fetch(ex?u+"&exclude="+ex:u)).json(),exNote="";
    if(ex&&!(d.routes&&d.routes.length)){d=await(await fetch(u)).json();exNote=" The free router could not apply your avoid choice, so this is the normal route."}
    if(!d.routes||!d.routes.length){info.textContent="No route found between these points.";return}
    // score: travel time + 5 min penalty per report sitting on the route
    const scored=d.routes.map(r=>({r,h:hits(r),s:r.duration+hits(r).length*300})).sort((a,b)=>a.s-b.s);
    const best=scored[0];lastRoute=best.r;startNav(best.r);
    if(routeLine)map.removeLayer(routeLine);
    routeLine=L.geoJSON(best.r.geometry,{style:{color:"#4318ff",weight:9,opacity:.95}}).addTo(map);
    if(announceNext||!nav||!follow)map.fitBounds(routeLine.getBounds(),{padding:[90,60]});
    const km=(best.r.distance/1000).toFixed(1),min=Math.round(best.r.duration/60);
    let msg=`${km} km, about ${min} min (speed-limit estimate, not live traffic).`;
    msg+=best.h.length?` ${best.h.length} report(s) on this route.`:` No reports on this route.`;
    if(d.routes.length>1&&scored[0].r!==d.routes[0])msg+=" Rerouted around reports.";
    msg+=exNote+leaveBy(best.r.duration);if(!meFromGPS)msg+=" Live voice turns need your GPS location as the start.";
    info.textContent=msg;
    if(!navMode)document.getElementById("startbtn").style.display="block";setMin(true);document.getElementById("barTxt").textContent=min+" min, "+km+" km. "+(best.r.legs[0].steps[0]?phrase(best.r.legs[0].steps[0]):"");
    if(announceNext){announceNext=false;speak("Route ready. "+km+" kilometres, about "+min+" minutes."+(nav&&nav.steps[0]?" "+phrase(nav.steps[0])+".":""))}
    const ol=document.getElementById("steps");ol.innerHTML="";
    best.r.legs.flatMap(l=>l.steps).forEach(s=>{if(!s.maneuver)return;const li=document.createElement("li");
      const t=s.maneuver.type,m=s.maneuver.modifier||"";
      li.textContent=phrase(s)+" ("+Math.round(s.distance)+" m)";ol.appendChild(li)});
  }catch(e){info.textContent="Routing failed. If you opened this inside the Claude app, open the file in Chrome instead. Otherwise the free router may be busy; try again."}
}

// ---- voice guidance + live following
function speak(t){
  if(muted||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";speechSynthesis.speak(u)}catch(e){}
}
function phrase(s){
  const t=s.maneuver.type,m=s.maneuver.modifier||"",n=s.name?" onto "+s.name:"";
  if(t==="arrive")return s.mid?"You have reached your stop":"You have arrived";
  if(t==="depart")return "Head out"+(s.name?" on "+s.name:"");
  if(t==="roundabout"||t==="rotary")return "Enter the roundabout"+(s.maneuver.exit?" and take exit "+s.maneuver.exit:"");
  if(m==="uturn")return "Make a U-turn";
  if(t==="continue"||t==="new name"||m==="straight")return "Continue straight"+(s.name?" on "+s.name:"");
  return "Turn "+m+n;
}
function dist(a,b){
  const R=6371000,k=Math.PI/180,dl=(b[0]-a[0])*k,dg=(b[1]-a[1])*k;
  const x=Math.sin(dl/2)**2+Math.cos(a[0]*k)*Math.cos(b[0]*k)*Math.sin(dg/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function startNav(route){
  route.legs.forEach((l,li)=>{if(li<route.legs.length-1&&l.steps.length)l.steps[l.steps.length-1].mid=true});if(announceNext)follow=false;nav={steps:route.legs.flatMap(l=>l.steps),i:1,s250:false,s60:false,line:route.geometry.coordinates.map(([x,y])=>[y,x])};
  offCount=0;
  if(meFromGPS&&navigator.geolocation&&watchId===null&&(navMode||announceNext)){
    watchId=navigator.geolocation.watchPosition(onPos,()=>{},{enableHighAccuracy:true,maximumAge:1000});
  }
  keepAwake();
}
function finishNav(){document.getElementById("lanes").style.display="none";
  nav=null;
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
}
function onPos(p){
  if(!meFromGPS)return;
  if(p.coords.accuracy>80)return;
  const rl=p.coords.latitude,rg=p.coords.longitude;
  let lat=rl,lng=rg;
  const sp=snapRoute(rl,rg);if(sp){lat=sp[0];lng=sp[1]}
  speedKmh=p.coords.speed!=null?p.coords.speed*3.6:null;
  if(p.coords.heading!=null&&!isNaN(p.coords.heading))heading=p.coords.heading;
  if(hu&&speedKmh!=null&&speedKmh>3)setRot(heading);
  setMe(lat,lng,true);roadInfo(rl,rg);camCheck(lat,lng);updateHud();
  if(!nav||!dest)return;
  if(follow)map.panTo([lat,lng]);
  let md=Infinity;
  for(let i=0;i<nav.line.length-1;i++)md=Math.min(md,dSeg([rl,rg],nav.line[i],nav.line[i+1]));
  if(md>60){
    offCount++;
    if(offCount>=3&&Date.now()-lastReroute>20000){lastReroute=Date.now();offCount=0;speak("Rerouting");reroute()}
    return;
  }
  offCount=0;
  const s=nav.steps[nav.i];if(!s)return;
  const d=dist([lat,lng],[s.maneuver.location[1],s.maneuver.location[0]]);
  if(s.maneuver.type==="arrive"&&d<30){
    if(s.mid){speak("You have reached your stop");toast("Stop reached");stops.shift();drawStops();nav.i++;nav.s250=false;nav.s60=false;return}
    speak("You have arrived");toast("You have arrived");exitNav();return}
  if(d<30){nav.i++;nav.s250=false;nav.s60=false;return}
  const ph=phrase(s);showLanes(s,d);updateNavUI(d,s);
  document.getElementById("barTxt").textContent="In "+(d>=1000?(d/1000).toFixed(1)+" km":Math.round(d/10)*10+" m")+": "+ph;
  if(d<60&&!nav.s60){nav.s60=true;nav.s250=true;speak(ph+" now")}
  else if(d<250&&!nav.s250){nav.s250=true;speak("In "+(Math.round(d/10)*10)+" metres, "+ph.charAt(0).toLowerCase()+ph.slice(1))}
}
document.getElementById("recenter").onclick=()=>{
  if(!meFromGPS){toast("Following needs GPS as your start");return}
  follow=true;map.setView([me.lat,me.lng],Math.max(map.getZoom(),16));toast("Following your location");
};
document.getElementById("whole").onclick=()=>{
  follow=false;
  if(routeLine)map.fitBounds(routeLine.getBounds(),{padding:[90,60]});else toast("Get a route first");
};
map.getContainer().addEventListener("pointerdown",()=>{if(!hu)follow=false});
const AR={left:"\u2190","slight left":"\u2196","sharp left":"\u2199",straight:"\u2191",right:"\u2192","slight right":"\u2197","sharp right":"\u2198",uturn:"\u21B6"};
function snapRoute(lat,lng){
  if(!nav)return null;
  const k=111320,c=Math.cos(lat*Math.PI/180),px=lng*k*c,py=lat*k;let best=null,bd=1e9;
  for(let i=0;i<nav.line.length-1;i++){
    const a=nav.line[i],b=nav.line[i+1],ax=a[1]*k*c,ay=a[0]*k,dx=b[1]*k*c-ax,dy=b[0]*k-ay,l=dx*dx+dy*dy;
    let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
    if(d<bd){bd=d;best=[a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])]}
  }
  return bd<35?best:null;
}
function nearRoute(pt,m){
  if(!nav)return false;
  for(let i=0;i<nav.line.length-1;i++)if(dSeg(pt,nav.line[i],nav.line[i+1])<m)return true;
  return false;
}
function roadInfo(lat,lng){
  if(Date.now()-lastRoad<15000)return;lastRoad=Date.now();
  const q='[out:json][timeout:8];(way(around:25,'+lat+','+lng+')["maxspeed"];node(around:700,'+lat+','+lng+')["highway"="speed_camera"];);out center tags;';
  fetch("https://overpass-api.de/api/interpreter?data="+encodeURIComponent(q)).then(r=>r.json()).then(d=>{
    const w=d.elements.find(e=>e.type==="way");
    lim=w?parseInt(w.tags.maxspeed):null;if(isNaN(lim))lim=null;
    cams=d.elements.filter(e=>e.type==="node").map(e=>({id:e.id,lat:e.lat,lng:e.lon}));
    updateHud();
  }).catch(()=>{});
}
function updateHud(){
  const h=document.getElementById("hud");
  if(speedKmh==null&&lim==null){h.style.display="none";return}
  h.style.display="flex";
  const over=lim!=null&&speedKmh!=null&&speedKmh>lim+5;
  h.innerHTML='<div class="spd'+(over?' over':'')+'"><b>'+(speedKmh!=null?Math.round(speedKmh):"--")+'</b><small>km/h</small></div>'+(lim!=null?'<div class="lim">'+lim+'</div>':'');
}
function camCheck(lat,lng){
  cams.forEach(c=>{
    const d=dist([lat,lng],[c.lat,c.lng]);
    if(d<500&&!camSaid[c.id]&&nearRoute([c.lat,c.lng],40)){camSaid[c.id]=1;speak("Speed camera ahead");toast("Speed camera ahead")}
    if(d>800)delete camSaid[c.id];
  });
}
function showLanes(s,d){
  const el=document.getElementById("lanes"),L=s.intersections&&s.intersections[0]&&s.intersections[0].lanes;
  if(!L||d>400){el.style.display="none";return}
  el.style.display="flex";
  el.innerHTML=L.map(l=>'<span class="'+(l.valid?'v':'')+'">'+(l.indications||[]).map(i=>AR[i]||"").join("")+'</span>').join("");
}
function keepAwake(){try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(nav){keepAwake();if(Date.now()-hiddenAt>5000)toast("Guidance pauses when the screen is off. Keep this page open.")}
});
function leaveBy(sec){
  const v=document.getElementById("arr").value;if(!v)return"";
  const hm=v.split(":").map(Number),t=new Date();t.setHours(hm[0],hm[1],0,0);if(t<new Date())t.setDate(t.getDate()+1);
  const l=new Date(t-(sec+300)*1000);
  return " To arrive by "+v+", leave by "+l.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+" (5 min buffer, no live traffic).";
}
["notoll","nohwy","arr"].forEach(id=>document.getElementById(id).addEventListener("change",()=>{if(me&&dest)reroute()}));
function arrowFor(s){const t=s.maneuver.type,m=s.maneuver.modifier||"";if(t==="arrive")return"\u2691";if(t==="roundabout"||t==="rotary")return"\u21BB";return AR[m]||"\u2191"}
function fmtD(d){return d>=1000?(d/1000).toFixed(1)+" km":(Math.round(d/10)*10)+" m"}
function updateNavUI(d,s){
  if(!navMode||!nav||!s||!lastRoute)return;
  const s2=nav.steps[nav.i+1],th=document.getElementById("nt-then");
  document.getElementById("nt-arrow").textContent=arrowFor(s);
  document.getElementById("nt-dist").textContent=fmtD(d);
  document.getElementById("nt-text").textContent=phrase(s);
  if(s2){th.style.display="block";document.getElementById("nt-then-arrow").textContent=arrowFor(s2)}else th.style.display="none";
  let rem=d;for(let j=nav.i;j<nav.steps.length;j++)rem+=nav.steps[j].distance;
  const r=lastRoute,sec=r.distance?r.duration*rem/r.distance:0;
  document.getElementById("nb-eta").textContent=Math.max(1,Math.round(sec/60))+" min";
  document.getElementById("nb-sub").textContent=(rem/1000).toFixed(1)+" km \u2022 "+new Date(Date.now()+sec*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}
function enterNav(){
  if(!lastRoute){toast("Get a route first");return}
  navMode=true;if(!nav)startNav(lastRoute);
  document.body.classList.add("nav");document.getElementById("startbtn").style.display="none";
  document.getElementById("navtop").appendChild(document.getElementById("lanes"));
  follow=true;if(me)map.setView([me.lat,me.lng],17);if(hu)setRot(curHeading());
  const s=nav.steps[nav.i];
  if(s&&me)updateNavUI(dist([me.lat,me.lng],[s.maneuver.location[1],s.maneuver.location[0]]),s);
  if(!meFromGPS)toast("Live guidance needs GPS as your start");
  speak("Navigation started. "+(nav.steps[0]?phrase(nav.steps[0]):""));
}
function exitNav(){
  navMode=false;document.body.classList.remove("nav","rep");follow=false;finishNav();
  document.querySelector(".top").insertBefore(document.getElementById("lanes"),document.getElementById("body"));
  document.getElementById("startbtn").style.display="block";setMin(false);
  if(routeLine)map.fitBounds(routeLine.getBounds(),{padding:[90,60]});
}
document.getElementById("startbtn").onclick=enterNav;
document.getElementById("endnav").onclick=exitNav;
document.getElementById("nb-rep").onclick=()=>document.body.classList.toggle("rep");
document.getElementById("rep").addEventListener("click",()=>document.body.classList.remove("rep"));
document.getElementById("mute2").onclick=()=>document.getElementById("mute").click();
const CATS={
gas:{e:"\u26FD",l:"Gas",n:"Petrol station",f:['["amenity"="fuel"]']},
cafe:{e:"\u2615",l:"Cafe",n:"Cafe",f:['["amenity"="cafe"]']},
food:{e:"\u{1F37D}\uFE0F",l:"Food",n:"Restaurant",f:['["amenity"~"restaurant|fast_food|food_court"]']},
parking:{e:"\u{1F17F}\uFE0F",l:"Parking",n:"Parking",f:['["amenity"="parking"]']},
police:{e:"\u{1F46E}",l:"Police",n:"Police station",f:['["amenity"="police"]']},
health:{e:"\u{1F3E5}",l:"Hospital",n:"Hospital or pharmacy",f:['["amenity"~"hospital|pharmacy"]']},
atm:{e:"\u{1F3E7}",l:"ATM",n:"ATM or bank",f:['["amenity"~"atm|bank"]']},
mosque:{e:"\u{1F54C}",l:"Mosque",n:"Mosque",f:['["amenity"="place_of_worship"]["religion"="muslim"]']},
wc:{e:"\u{1F6BB}",l:"Toilets",n:"Toilets or rest area",f:['["amenity"="toilets"]','["highway"~"rest_area|services"]']},
ev:{e:"\u{1F50C}",l:"EV charge",n:"EV charging",f:['["amenity"="charging_station"]']},
shop:{e:"\u{1F6D2}",l:"Shops",n:"Shop",f:['["shop"~"convenience|supermarket|mall"]']}
};
Object.keys(CATS).forEach(k=>{const b=document.createElement("button");b.innerHTML="<span>"+CATS[k].e+"</span>"+CATS[k].l;b.onclick=()=>findCat(k);document.getElementById("chips").appendChild(b)});
function closeSheet(){document.getElementById("sheet").classList.remove("open")}
function routeIdx(p){
  const c=lastRoute.geometry.coordinates;let bi=0,bd=1e18;
  for(let i=0;i<c.length;i++){const dd=(c[i][1]-p.lat)**2+(c[i][0]-p.lng)**2;if(dd<bd){bd=dd;bi=i}}
  return bi;
}
function aheadPts(){
  const c=lastRoute.geometry.coordinates,i0=me?routeIdx({lat:me.lat,lng:me.lng}):0;
  let last=[c[i0][1],c[i0][0]],acc=0;const pts=[last];
  for(let i=i0+1;i<c.length&&acc<15000;i++){
    const q=[c[i][1],c[i][0]],d=dist(last,q);
    if(d>=800){acc+=d;pts.push(q);last=q}
  }
  return pts;
}
function drawStops(){
  stopMarkers.forEach(m=>map.removeLayer(m));
  stopMarkers=stops.map(st=>L.marker([st.lat,st.lng],{interactive:false,icon:L.divIcon({className:"",html:'<div class="pin">\u{1F4CC}</div>',iconSize:[24,24],iconAnchor:[12,24]})}).addTo(map));
  const el=document.getElementById("stoplist");
  el.innerHTML=stops.length?'<div class="sec">Stops on this drive</div>':"";
  stops.forEach((st,i)=>{
    const d=document.createElement("div");d.className="pc";
    d.innerHTML='<b></b><div class="pb"><button>Remove stop</button></div>';
    d.querySelector("b").textContent=(i+1)+". "+st.name;
    d.querySelector("button").onclick=()=>{stops.splice(i,1);drawStops();if(me&&dest)reroute()};
    el.appendChild(d);
  });
}
function addStop(p){
  if(!dest){toast("Set a destination first, then add stops");return}
  stops.push({lat:p.lat,lng:p.lng,name:p.name});
  if(lastRoute)stops.sort((a,b)=>routeIdx(a)-routeIdx(b));
  drawStops();closeSheet();toast("Stop added");
  if(me)reroute();
}
function showPlaces(list){
  const el=document.getElementById("plist");el.innerHTML="";
  if(!list.length){el.innerHTML='<div class="pc">Nothing found. Try another category or a different search.</div>';return}
  list.forEach(p=>{
    const d=document.createElement("div");d.className="pc";
    d.innerHTML='<b></b><small></small><div class="pb"><button class="alt">Go</button><button>Add stop</button></div>';
    d.querySelector("b").textContent=p.name;d.querySelector("small").textContent=p.sub;
    const bs=d.querySelectorAll("button");
    bs[0].onclick=()=>{document.getElementById("q").value=p.name;closeSheet();setDest(p.lat,p.lng)};
    bs[1].onclick=()=>addStop(p);
    el.appendChild(d);
  });
}
async function findCat(k){
  const el=document.getElementById("plist");el.innerHTML='<div class="pc">Searching nearby...</div>';
  const base=me?[me.lat,me.lng]:[map.getCenter().lat,map.getCenter().lng];
  let area;
  if(lastRoute){area="(around:1200,"+aheadPts().map(p=>p[0].toFixed(5)+","+p[1].toFixed(5)).join(",")+")"}
  else area="(around:3000,"+base[0]+","+base[1]+")";
  const q="[out:json][timeout:20];("+CATS[k].f.map(f=>"nwr"+f+area+";").join("")+");out center 80;";
  try{
    const d=await(await fetch("https://overpass-api.de/api/interpreter?data="+encodeURIComponent(q))).json();
    const list=d.elements.map(e=>{
      const la=e.lat!=null?e.lat:(e.center&&e.center.lat),lo=e.lon!=null?e.lon:(e.center&&e.center.lon),t=e.tags||{};
      if(la==null)return null;
      const m=dist(base,[la,lo]);
      return{lat:la,lng:lo,m,name:t.name||t.brand||t.operator||CATS[k].n,sub:fmtD(m)+" away"+(lastRoute?", near your route":"")};
    }).filter(Boolean).sort((a,b)=>a.m-b.m).slice(0,8);
    showPlaces(list);
  }catch(e){el.innerHTML='<div class="pc">Search failed. The free map service may be busy; try again.</div>'}
}
async function findText(){
  const v=document.getElementById("sq").value.trim();if(!v)return;
  const el=document.getElementById("plist");el.innerHTML='<div class="pc">Searching...</div>';
  const c=me?[me.lat,me.lng]:[map.getCenter().lat,map.getCenter().lng];
  try{
    const d=await(await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=6&viewbox="+(c[1]-.5)+","+(c[0]+.5)+","+(c[1]+.5)+","+(c[0]-.5)+"&q="+encodeURIComponent(v))).json();
    showPlaces(d.map(p=>{const m=dist(c,[+p.lat,+p.lon]);return{lat:+p.lat,lng:+p.lon,m,name:p.display_name.split(",").slice(0,2).join(","),sub:fmtD(m)+" away"}}));
  }catch(e){el.innerHTML='<div class="pc">Search failed. Check your connection and try again.</div>'}
}
function newDrive(){
  if(navMode){navMode=false;document.body.classList.remove("nav","rep");document.querySelector(".top").insertBefore(document.getElementById("lanes"),document.getElementById("body"))}
  finishNav();follow=false;
  [routeLine,destMarker].forEach(l=>{if(l)map.removeLayer(l)});routeLine=null;destMarker=null;
  stops=[];drawStops();dest=null;lastRoute=null;
  document.getElementById("q").value="";document.getElementById("steps").innerHTML="";document.getElementById("plist").innerHTML="";
  document.getElementById("info").textContent="Search a destination, or tap the map.";
  document.getElementById("barTxt").textContent="Search a destination";
  document.getElementById("startbtn").style.display="none";closeSheet();setMin(false);
  document.getElementById("q").focus();
}
document.getElementById("sq").addEventListener("keydown",e=>{if(e.key==="Enter")findText()});
document.getElementById("more").onclick=()=>document.getElementById("sheet").classList.toggle("open");
document.getElementById("nb-mid").onclick=()=>document.getElementById("sheet").classList.toggle("open");
document.getElementById("newdrive").onclick=newDrive;
document.getElementById("clearstops").onclick=()=>{stops=[];drawStops();closeSheet();if(me&&dest)reroute()};
map.getContainer().addEventListener("pointerdown",closeSheet);
function bearing(a,b){
  const k=Math.PI/180,dl=(b[1]-a[1])*k,y=Math.sin(dl)*Math.cos(b[0]*k),x=Math.cos(a[0]*k)*Math.sin(b[0]*k)-Math.sin(a[0]*k)*Math.cos(b[0]*k)*Math.cos(dl);
  return (Math.atan2(y,x)/k+360)%360;
}
function curHeading(){
  if(speedKmh!=null&&speedKmh>3&&heading!=null)return heading;
  if(lastRoute){
    const c=lastRoute.geometry.coordinates,i=me?routeIdx({lat:me.lat,lng:me.lng}):0,j=Math.min(i+4,c.length-1);
    if(i<j)return bearing([c[i][1],c[i][0]],[c[j][1],c[j][0]]);
  }
  return heading||0;
}
function setRot(h){
  rot+=((h-rot+540)%360)-180;
  document.getElementById("map").style.transform="rotate("+(-rot)+"deg)";
  document.documentElement.style.setProperty("--hdg",rot+"deg");
}
function applyOrient(){
  document.body.classList.toggle("hu",hu);
  const b=document.getElementById("follow");
  b.classList.toggle("on",!hu);
  b.innerHTML="&#10148; "+(hu?"Moving Direction":"North Up");
  map.options.touchZoom=hu?"center":true;
  if(hu)map.dragging.disable();else map.dragging.enable();
  if(hu)setRot(curHeading());
  else{rot=0;document.getElementById("map").style.transform="";document.documentElement.style.setProperty("--hdg","0deg")}
  setTimeout(()=>{map.invalidateSize();if(me&&(follow||hu))map.panTo([me.lat,me.lng],{animate:false})},60);
  if(me)setMe(me.lat,me.lng,meFromGPS);
  toast(hu?"Moving Direction: map turns as you drive":"North Up");
}
document.getElementById("follow").onclick=()=>{hu=!hu;applyOrient()};
function setMin(v){
  document.querySelector(".top").classList.toggle("min",v);
  document.getElementById("tog").textContent=v?"Search":"Hide";
}
document.getElementById("tog").onclick=()=>setMin(!document.querySelector(".top").classList.contains("min"));
document.getElementById("barTxt").onclick=()=>setMin(false);
["q","from"].forEach(id=>document.getElementById(id).addEventListener("focus",()=>setMin(false)));
document.getElementById("mute").onclick=function(){
  muted=!muted;document.querySelectorAll("#mute,#mute2").forEach(b=>b.textContent=muted?"\u{1F507}":"\u{1F50A}");
  if(muted&&window.speechSynthesis)speechSynthesis.cancel();
};

window.pick=(lat,lng,w)=>{map.closePopup();w==="to"?setDest(lat,lng):setStart(lat,lng)};
map.on("click",e=>{if(hu){toast("Switch to North Up to pick a point on the map");return}
  if(pendingType){add(pendingType,e.latlng.lat,e.latlng.lng);pendingType=null;document.querySelectorAll(".report button").forEach(x=>x.classList.remove("on"));return}
  const a=e.latlng.lat.toFixed(6),b=e.latlng.lng.toFixed(6);
  L.popup().setLatLng(e.latlng).setContent(`<button style="padding:6px 10px" onclick="pick(${a},${b},'to')">Go here</button> <button style="padding:6px 10px" onclick="pick(${a},${b},'from')">Start here</button>`).openOn(map);
});
const qEl=document.getElementById("q"),fEl=document.getElementById("from");
qEl.addEventListener("input",()=>{dest=null});
fEl.addEventListener("input",()=>{me=null});
qEl.addEventListener("keydown",e=>{if(e.key==="Enter")search("q")});
fEl.addEventListener("keydown",e=>{if(e.key==="Enter")search("from")});
document.getElementById("go").onclick=()=>{
  announceNext=true;speak("Voice guidance is on. Finding your route.");
  if(qEl.value.trim()&&!dest)search("q");
  else if(fEl.value.trim()&&!me)search("from");
  else if(me&&dest)reroute();
  else document.getElementById("info").textContent="Set a start (From box or map tap) and a destination.";
};
document.getElementById("loc").onclick=locate;
draw();locate();
</script>
